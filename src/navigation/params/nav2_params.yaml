bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    # 只注册 NavigateToPose；收到目标后仅计算并发布 /plan。
    # Nav2 Humble uses `navigators` (not `navigator_plugins`).  Keeping only
    # this entry prevents loading the system NavigateThroughPoses recovery tree.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # 由 navigation_launch.py 重写为 behavior_trees/plan_to_pose.xml。
    default_nav_to_pose_bt_xml: ""
    # Humble 激活时仍会预加载 ThroughPoses；保留此键供 launch 重写，
    # 防止回退到系统中包含 RecoveryNode/FollowPath 的默认行为树。
    default_nav_through_poses_bt_xml: ""
    bt_loop_duration: 10
    default_server_timeout: 10
    # ClearEntireCostmap 等 BT 节点在树加载时等待 costmap 服务的最长时间（ms）。
    # 默认 1000 ms 对组合式启动时的 costmap 生命周期服务过短。
    wait_for_service_timeout: 5000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_rate_controller_bt_node

global_costmap:
  global_costmap:
    ros__parameters:
      # 与 10 Hz 路径安全检查同步，动态障碍进入通行走廊后最多约 0.2 s 被看到。
      update_frequency: 10.0
      # 与内部更新和路径安全检查同频，避免 RViz 看见的是最多 1 秒前的动态层。
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 30
      height: 30
      # TerrainMincoPlanner 在二维栅格上规划中心线。使用矩形安全包络的外接圆，
      # 让碰撞代价不再随机器人实际朝向变化；RViz 车体外观不由此参数控制。
      # TODO: 换机修改机器人外接圆半径
      robot_radius: 0.566
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 先验栅格图（pcd_to_occupancy_map 发的 /map）
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        footprint_clearing_enabled: True
      # 分割结果已经是二维规划所需的“地面/障碍”语义，不再维护额外 3D STVL。
      # 障碍点负责标记；地面点负责射线清除，障碍移走后对应格能重新变为空闲。
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: obstacle_mark ground_clear
        obstacle_mark:
          data_type: PointCloud2
          topic: /segmentation/obstacle
          marking: true
          # 当前障碍回波既作为射线终点标记障碍，也清除传感器到终点之间的旧格。
          clearing: true
          obstacle_min_range: 0.0
          obstacle_max_range: 10.0
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          # 与分割端一致，再做一次 8cm 贴地噪声保护。
          min_obstacle_height: 0.08
          max_obstacle_height: 1.6
          # 不在 ObservationBuffer 中叠加历史帧；动态稳定性由连续雷达帧提供，
          # 否则行人移动会把最近若干帧全部留成轨迹。
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
        ground_clear:
          data_type: PointCloud2
          topic: /segmentation/ground
          marking: false
          clearing: true
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.65
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["TerrainMinco"]
    TerrainMinco:
      plugin: "navigation/TerrainMincoPlanner"
      occupied_cost_threshold: 253
      # 平地：0.8 x 0.8 m 安全 footprint 的外接圆；只从 cost=254 的真实致命格
      # 构造一次硬净空，costmap 原 inflation 仅作为 A* 软偏好，避免重复膨胀。
      flat_clearance_radius: 0.5656854249
      # 坡道/台阶：沿 /terrain/direction 对齐的 0.8 m 方形包络。
      terrain_half_length: 0.40
      terrain_half_width: 0.40
      # rolling costmap 中的未知格仍可通行，但保留一定代价。
      unknown_traversal_cost: 50
      obstacle_weight: 1.0
      max_astar_expansions: 1000000
      # 10 Hz BT 调用只检查缓存路径；只有路径受阻、目标变化或偏离时才重跑 A* + MINCO。
      max_path_deviation: 0.35
      goal_cache_tolerance: 0.05
      # 安全检查仍由 BT 以 10 Hz 执行；障碍格减少后，低频评估是否值得恢复更短路线。
      optimization_check_frequency: 1.0
      costmap_stable_time: 0.8
      optimization_cooldown: 1.5
      minimum_length_improvement_ratio: 0.08
      # 坡道/台阶段路径切线与地形方向最多偏离 15°，上下行均允许。
      min_terrain_alignment_cosine: 0.9659258263
      terrain_type_topic: /terrain/type
      terrain_direction_topic: /terrain/direction
      seed_spacing: 0.45
      output_spacing: 0.05
      validation_spacing: 0.025
      curvature_max: 4.0
      curvature_rate_max: 8.0
      minco_max_iterations: 400
      minco_obstacle_weight: 1000.0
      minco_curvature_weight: 100.0
      minco_curvature_rate_weight: 100.0
      minco_alignment_weight: 2000.0
